server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Every location repeats the headers: nginx drops inherited add_header as soon as a location sets its own.
  include /etc/nginx/security-headers.inc;

  # The manifest and the portal modules are the way a new portal build reaches people: never cached.
  location = /federation.manifest.json {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri =404;
  }

  # The identity-audit portal module, served from this same origin; a missing one is a 404, not the shell.
  location ^~ /portals/ {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri =404;
  }

  # Hashed build files never change under the same name.
  location ~* ^/[^/]+\.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.inc;
    try_files $uri /index.html;
  }
}
